# Verified configuration: caioteste, 2026-11-08.
# Install in /etc/nginx/sites-available/str.lusosolutions.com
# Do not publish .stremio-users, .stremio-session-key or TLS private keys.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
map $http_authorization $stremio_backend_authorization {
    default $http_authorization;
    ~*^Basic "";
}
# HLS only: resolve public source URLs internally, avoiding Basic/cookie re-entry.
map "$uri|$args" $stremio_hls_media_args {
    default "";
    ~*^/hlsv2/[^|]*\|(?<hls_pre>.*mediaURL=)https%3A%2F%2Fstr\.lusosolutions\.com(?<hls_post>%2F.*)$ "${hls_pre}http%3A%2F%2F192.168.1.199%3A11470${hls_post}";
}
server {
    listen 80;
    server_name str.lusosolutions.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        allow all;
    }
    access_log /var/log/nginx/str-http-access.log;
    error_log /var/log/nginx/str-http-error.log warn;
    location / {
        proxy_pass http://192.168.1.199:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 20s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
server {
    listen 443 ssl http2;
    server_name str.lusosolutions.com;
    ssl_certificate /etc/letsencrypt/live/npm-11/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/npm-11/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/str-https-access.log;
    error_log /var/log/nginx/str-https-error.log warn;

    location = /_session/start {
        auth_basic "Stremio - acesso restrito";
        auth_basic_user_file /etc/nginx/.stremio-users;
        proxy_pass http://127.0.0.1:18765/issue;
        proxy_set_header X-Authenticated-User $remote_user;
        proxy_set_header Host $host;
    }
    location = /_session/check {
        internal;
        proxy_pass http://127.0.0.1:18765/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }
    location / {
        satisfy any;
        auth_request /_session/check;
        if ($stremio_hls_media_args) {
            set $args $stremio_hls_media_args;
        }
        proxy_pass https://192-168-1-199.519b6502d940.stremio.rocks:12470;
        proxy_set_header Host 192-168-1-199.519b6502d940.stremio.rocks;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name 192-168-1-199.519b6502d940.stremio.rocks;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        auth_basic "Stremio - acesso restrito";
        auth_basic_user_file /etc/nginx/.stremio-users;
        proxy_set_header Authorization $stremio_backend_authorization;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 20s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
